name: Feature request
description: Propose a bounded implementation change
title: "[Feature] "
labels: ['type:feature']
body:
  - type: textarea
    id: scope
    attributes:
      label: Objective, scope, and dependencies
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria, tests, and documentation
    validations:
      required: true
